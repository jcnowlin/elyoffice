# Windows ARM64 (aarch64-pc-windows-msvc) build, pieced up so no single
# runner sits on the whole pipeline: engines build in parallel matrix legs
# with per-engine caches, then each app builds+packages in its own job.
# Manual trigger only until the first green run. CEF ARM64 story: the
# windowsarm64 minimal build is fetched via cef-rs's export-cef-dir and
# cached as the cef engine, so ely-mark now runs like the other apps.
name: windows-arm64
on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Space-separated app slugs to build and package"
        default: "ely-doc ely-table ely-show ely-pdf ely-tree"
        required: true
      lo_version:
        description: "LibreOffice version to extract for ely-lok"
        default: "26.8.0"
        required: true

env:
  ELY_ARCH: aarch64
  CARGO_BUILD_TARGET: aarch64-pc-windows-msvc
  PYTHONUTF8: 1

jobs:
  engines:
    name: engine ${{ matrix.engine }}
    runs-on: windows-11-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: lo
            path: engines/lo-win-arm64
            key: ely-lo-win-arm64-${{ inputs.lo_version }}
          - engine: mupdf
            path: |
              engines/mupdf-build
              engines/mupdf-src/COPYING
              engines/mupdf-src/thirdparty
              engines/mupdf-src/resources/fonts
              engines/vcpkg/installed/arm64-windows-static
              reference/mupdf/include
            key: ely-mupdf-win-arm64-8ad45e92
          - engine: git
            path: engines/git
            key: ely-mingit-arm64-2.56.0
          - engine: tessdata
            path: engines/tessdata
            key: ely-tessdata-2026-10
          - engine: cef
            path: |
              engines/cef
              reference/cef/LICENSE.txt
            key: ely-cef-win-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Compute CEF cache key
        id: cefkey
        if: matrix.engine == 'cef'
        shell: bash
        run: |
          # The CEF version comes from the cef-rs pin; fail if the two
          # pins disagree so the cache can never serve a stale version.
          a=$(awk '$1=="fetch" && $2=="cef-rs" {print $4}' scripts/fetch-references.sh)
          b=$(grep -o 'cef-rs", rev = "[0-9a-f]*' Cargo.toml | grep -o '[0-9a-f]*$')
          [ "$a" = "$b" ] || { echo "cef-rs pin mismatch: refs=$a Cargo.toml=$b" >&2; exit 1; }
          echo "key=ely-cef-win-arm64-$a-${{ hashFiles('scripts/fetch-cef.sh') }}" >> "$GITHUB_OUTPUT"
      - name: Restore ${{ matrix.engine }} cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.path }}
          # hashFiles isn't allowed in the matrix definition, so script
          # hashes get appended here (must match the build job's keys).
          key: ${{ matrix.engine == 'mupdf' && format('{0}-{1}', matrix.key, hashFiles('scripts/build-mupdf.sh', 'patches/mupdf/**')) || matrix.engine == 'lo' && format('{0}-{1}', matrix.key, hashFiles('scripts/extract-official-lo-win-arm64.sh')) || matrix.engine == 'cef' && steps.cefkey.outputs.key || matrix.key }}
      - name: Build ${{ matrix.engine }}
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          ELY_LO_VERSION: ${{ inputs.lo_version }}
        run: |
          set -euo pipefail
          case "${{ matrix.engine }}" in
            lo)
              ./scripts/extract-official-lo-win-arm64.sh
              ;;
            mupdf)
              # vcpkg first: build-mupdf.sh links OpenSSL statically.
              [ -d engines/vcpkg ] || git clone --depth 1 https://github.com/microsoft/vcpkg.git engines/vcpkg
              ./engines/vcpkg/bootstrap-vcpkg.sh
              ./engines/vcpkg/vcpkg install "openssl:arm64-windows-static"
              ./scripts/fetch-references.sh
              ./scripts/build-mupdf.sh
              ;;
            git)
              ./scripts/build-git.sh
              ;;
            tessdata)
              ./scripts/fetch-tessdata.sh
              ;;
            cef)
              # Only the two pins we need; the full fetch-references.sh
              # clones LO/MuPDF/mailcore2 and more we don't want here.
              for name in cef cef-rs; do
                read -r url rev < <(awk -v n="$name" '$1=="fetch" && $2==n {print $3, $4}' scripts/fetch-references.sh)
                rm -rf "reference/$name"
                git init -q "reference/$name"
                git -C "reference/$name" fetch -q --depth 1 "$url" "$rev"
                git -C "reference/$name" checkout -q FETCH_HEAD
              done
              ./scripts/fetch-cef.sh
              [ -s engines/cef/icudtl.dat ] && [ -s engines/cef/libcef.dll ] && [ -s reference/cef/LICENSE.txt ]
              file engines/cef/libcef.dll | grep -qi 'aarch64\|arm64' || { echo "CEF is not ARM64" >&2; exit 1; }
              ;;
          esac

  build:
    name: ${{ matrix.app }}
    needs: engines
    runs-on: windows-11-arm
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        app: [ely-doc, ely-table, ely-show, ely-pdf, ely-tree, ely-mark]
    steps:
      - uses: actions/checkout@v4
      - name: Restore LibreOffice engine
        uses: actions/cache/restore@v4
        with:
          path: engines/lo-win-arm64
          key: ely-lo-win-arm64-${{ inputs.lo_version }}-${{ hashFiles('scripts/extract-official-lo-win-arm64.sh') }}
          fail-on-cache-miss: true
      - name: Restore MuPDF engine
        uses: actions/cache/restore@v4
        with:
          path: |
            engines/mupdf-build
            engines/mupdf-src/COPYING
            engines/mupdf-src/thirdparty
            engines/mupdf-src/resources/fonts
            engines/vcpkg/installed/arm64-windows-static
            reference/mupdf/include
          key: ely-mupdf-win-arm64-8ad45e92-${{ hashFiles('scripts/build-mupdf.sh', 'patches/mupdf/**') }}
          fail-on-cache-miss: true
      - name: Restore MinGit engine
        uses: actions/cache/restore@v4
        with:
          path: engines/git
          key: ely-mingit-arm64-2.56.0
          fail-on-cache-miss: true
      - name: Restore tessdata engine
        uses: actions/cache/restore@v4
        with:
          path: engines/tessdata
          key: ely-tessdata-2026-10
          fail-on-cache-miss: true
      - name: Compute CEF cache key
        id: cefkey
        if: matrix.app == 'ely-mark'
        shell: bash
        run: |
          a=$(awk '$1=="fetch" && $2=="cef-rs" {print $4}' scripts/fetch-references.sh)
          b=$(grep -o 'cef-rs", rev = "[0-9a-f]*' Cargo.toml | grep -o '[0-9a-f]*$')
          [ "$a" = "$b" ] || { echo "cef-rs pin mismatch: refs=$a Cargo.toml=$b" >&2; exit 1; }
          echo "key=ely-cef-win-arm64-$a-${{ hashFiles('scripts/fetch-cef.sh') }}" >> "$GITHUB_OUTPUT"
      - name: Restore CEF engine
        if: matrix.app == 'ely-mark'
        uses: actions/cache/restore@v4
        with:
          path: |
            engines/cef
            reference/cef/LICENSE.txt
          key: ${{ steps.cefkey.outputs.key }}
          fail-on-cache-miss: true
      - name: Setup Node.js
        if: matrix.app == 'ely-mark'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build ElyMark web content
        if: matrix.app == 'ely-mark'
        shell: bash
        run: ./scripts/build-mark-content.sh
      - name: Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup update --no-self-update stable
          rustup target add aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: win-arm64-${{ matrix.app }}
      - name: Stage and package ${{ matrix.app }}
        shell: bash
        env:
          ELY_LO_DIR: ${{ github.workspace }}/engines/lo-win-arm64
          ELY_DIST: ${{ github.workspace }}/dist
          # Only ely-mark links cef-dll-sys; this keeps build.rs from
          # downloading its own copy into OUT_DIR on every cold build.
          CEF_PATH: ${{ github.workspace }}/engines/cef
        run: |
          set -euo pipefail
          ./packaging/windows/installer.sh "${{ matrix.app }}"
          ls dist/
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows-arm64
          path: dist/*-windows-aarch64-setup.exe
          if-no-files-found: error
